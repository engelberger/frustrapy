[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "frustrapy-native"
version = "0.0.1"
description = "Native C++ (and optional CUDA) compute core for FrustraPy frustration backends"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Felipe Engelberger" }]
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/frustrapy_native"]
# The _core module is nanobind STABLE_ABI (see CMakeLists), so emit ONE cp312-abi3
# wheel per platform that loads on CPython 3.12+, instead of one wheel per Python
# minor. This is the default CPU build; the optional CUDA/Metal kernels (below) are a
# separate -C cmake.define install, not part of the published abi3 CPU wheels.
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
# Default CPU-only build. Turn the CUDA path on at install time on a machine with nvcc:
#   pip install ./native -C cmake.define.FRUSTRAPY_NATIVE_CUDA=ON
# Turn the Metal (Apple GPU) path on at install time on a Mac with metal-cpp + xcrun:
#   pip install ./native -C cmake.define.FRUSTRAPY_NATIVE_METAL=ON \
#       -C cmake.define.FRUSTRAPY_METAL_CPP_DIR=/path/to/metal-cpp
# (see native/docs/METAL_BUILD.md)
FRUSTRAPY_NATIVE_CUDA = "OFF"
FRUSTRAPY_NATIVE_METAL = "OFF"

# Multi-platform CPU wheel build (MAINTAINER step), driven by .github/workflows/
# wheels.yml. Matches native_tmol so both compiled cores produce the same cp312-abi3
# wheel shape. The default build here is CPU-only (CUDA/Metal stay the -C cmake.define
# opt-in above); CUDA/Metal wheels are not part of this matrix.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux*", "pp*"]
build-frontend = "build"
test-command = "python -c \"import frustrapy_native as n; print('module ok'); assert hasattr(n, 'compute_frustration')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86-64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
