name: CI

# Layered regression CI.
#
#   * lint        — advisory (non-blocking) ruff check.
#   * test-fast   — unit + smoke layer on a Python matrix; `pytest -m "not slow"`.
#                   No LAMMPS, runs in well under a minute. BLOCKING (required to merge):
#                   a regression in a pinned behaviour (cutoffs, IC math, coordinate
#                   mapping, the 3D-view classifier, dependency manifest) turns this red.
#   * test-e2e    — the real LAMMPS/AWSEM parity gates; `pytest -m slow`. Runs the
#                   1CRN all-three-modes anchor and the FrustraEvo byte-identity diffs
#                   against the committed fixtures, so any numeric/parity drift fails CI.
#                   The bundled lmp_serial binaries make this runnable on the hosted
#                   runner; needs perl (GenerateVisualizations.pl) + the runtime deps.
#   * build       — wheel + dep-count / runtime-asset tripwires (P0-A / P0-C).
#
# All jobs put the venv on PATH (tech-debt P1-22): PdbCoords2Lammps.sh spawns a bare
# `python3`, which must resolve Biopython, or a calculation dies mid-run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check
        # Advisory: ruff runs and reports findings in the log, but does not gate the
        # check (--exit-zero). The curated ignore list lives in pyproject [tool.ruff.lint].
        run: uvx ruff check frustrapy tests --exit-zero

  test-fast:
    name: test-fast (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Put venv on PATH (P1-22 — bare python3 subprocess needs Bio importable)
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install package + test deps
        # -e . pulls the full 9-package runtime set from pyproject (the P0-A fix).
        run: uv pip install --python .venv -e ".[cli,hdf5,mpnn]" pytest pytest-cov tomli
      - name: Import smoke (P0-A/P0-B — clean import, no manual tqdm install)
        run: python -c "import frustrapy; print('import frustrapy OK')"
      - name: Unit + smoke layer (fast lane — no LAMMPS)
        run: python -m pytest -m "not slow" -v

  test-e2e:
    name: test-e2e (parity gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install perl (GenerateVisualizations.pl / GenerateChargeFile.pl)
        run: sudo apt-get update && sudo apt-get install -y perl
      - name: Create venv
        run: uv venv --python 3.12 .venv
      - name: Put venv on PATH (P1-22 — bare python3 subprocess needs Bio importable)
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install package + test deps (full runtime set via -e .)
        run: uv pip install --python .venv -e ".[cli,hdf5,mpnn]" pytest pytest-cov tomli
      - name: E2e + parity gates (real LAMMPS — 1CRN anchor + FrustraEvo byte-diffs)
        # A numeric/parity regression against the committed fixtures fails the build.
        run: python -m pytest -m slow -v

  build:
    name: build wheel + dep-count tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel
        run: uv build --wheel
      - name: Assert runtime assets ship in the wheel (P0-C)
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          unzip -l "$WHEEL" | grep -E 'lmp_serial|PdbCoords2Lammps|fix_backbone_coeff|\.pl' \
            || { echo "FAIL: runtime assets missing from wheel"; exit 1; }
      - name: Assert the wheel declares all 9 runtime deps (not zero — P0-A tripwire)
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          COUNT=$(unzip -p "$WHEEL" '*/METADATA' | grep -c '^Requires-Dist:')
          echo "Requires-Dist count: $COUNT"
          test "$COUNT" -ge 9 || { echo "FAIL: expected >=9 runtime deps, got $COUNT"; exit 1; }
