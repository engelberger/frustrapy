name: Release

# Publish FrustraPy to (Test)PyPI via OIDC Trusted Publishing — NO stored API tokens.
#
# Prerequisites (one-time, maintainer — see docs blocker note for Phase 7):
#   1. Reserve the `frustrapy` name on PyPI + TestPyPI.
#   2. Configure a Trusted Publisher on each: project `frustrapy`, owner/repo
#      `engelberger/frustrapy`, workflow `release.yml`, environment `pypi` / `testpypi`.
#   3. Create GitHub Environments `testpypi` and `pypi` (add a required reviewer on
#      `pypi` for a manual-approval gate before the real publish).
#
# Flow:
#   * push an annotated tag `v*`  -> build, twine check, publish to TestPyPI (dry run),
#     then (after manual approval on the `pypi` environment) publish to PyPI.
#   * manual `workflow_dispatch` -> build + TestPyPI only (safe rehearsal).
#
# NOTE: actions are pinned by version tag here for readability. Before going live,
# pin every `uses:` to a full commit SHA (supply-chain hardening, per ROADMAP §7).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/frustrapy/
    permissions:
      id-token: write   # OIDC — mints a short-lived token, no secrets stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    # Only real releases (tag push), never the manual rehearsal.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi   # add a required reviewer here for manual approval
      url: https://pypi.org/project/frustrapy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
