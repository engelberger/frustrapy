[build-system]
# Hatchling: uv's default backend, ships non-.py package data by default, and
# needs the least config for a package whose hard part is shipping the AWSEM/Perl/
# shell + precompiled LAMMPS assets under frustrapy/core/scripts/. >=1.27 is
# PEP 639-aware (needed for the SPDX `license` string below).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "frustrapy"
version = "0.1.1"
description = "A Python package for protein frustration analysis"
readme = "README.md"
# Single Python floor. Replaces the prior 3-way mismatch (setup.py >=3.11,
# Poetry pyproject ^3.10). >=3.10 matches the README and the install path today.
# NOTE (risk R1): the dev_frustraevo rework (Phase 8) may need >=3.11 — surface
# before finalizing, do not silently bump.
requires-python = ">=3.10"
# The LICENSE file on disk is GPL v3 (GNU GENERAL PUBLIC LICENSE / Version 3).
# `-or-later` per ROADMAP §3 (primary source overrides the MIT classifier the old
# setup.py carried). GPL binaries force GPL regardless of intent.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Felipe Engelberger", email = "felipeengelberger@gmail.com" },
]
keywords = ["protein", "frustration", "structural-biology", "awsem", "frustratometer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    # No "License :: OSI Approved :: ..." trove classifier: the PEP 639 SPDX
    # `license` string above is the single source of truth.
]

# Runtime dependencies required to `import frustrapy` and run the no-graphics
# analysis path. tqdm was a phantom dep (imported frustration.py / mutations.py,
# declared nowhere).
#
# Phase 7 (lazify-before-demote): scipy / scikit-learn / python-igraph / leidenalg
# are NO LONGER core. They are used ONLY by analysis/clustering.py
# (detect_dynamic_clusters), whose import is now lazified in __init__.py via PEP-562
# __getattr__, so `import frustrapy` no longer drags them in. They moved to the
# `clustering` optional extra below (statsmodels joins them for the loess fit).
#
# The Phase 2 dev_benchmark merge added three more hard deps:
#   * rich      — utils/ui.py (Rich display) is imported by the core engine
#                 (frustration.py / frustration_calculator.py / mutations.py), so it
#                 is required just to `import frustrapy`.
#   * matplotlib, seaborn — benchmark/plotting.py + evolution; pulled in eagerly
#                 because __init__.py imports `benchmark` and `evolution`. Still core
#                 (CANDIDATES for a future `benchmark`/`evolution` extra once those
#                 chains are lazified — out of scope for Phase 7's clustering demotion).
#   * logomaker — evolution/sequence_logo.py (FrustraEvo), eager via the evolution
#                 import; core for now.
# plotly pinned <6: plotly 6.x removed the deprecated `titlefont` property the
# graphics path still uses.
dependencies = [
    "numpy",
    "pandas",
    "biopython",
    "plotly<6",
    "tqdm",
    "rich",
    "matplotlib",
    "seaborn",
    "logomaker",
]

[project.optional-dependencies]
# 3D viewers + static PNG export, all deferred (imported inside functions):
#   py3Dmol (structure.py), IPython.display (structure.py), kaleido (Plotly PNG).
viz = ["py3Dmol>=2.4.2", "ipython", "kaleido"]
# Optional memory logging; psutil imported lazily in utils/decorators.py.
perf = ["psutil"]
# Dynamic-trajectory residue clustering (detect_dynamic_clusters). Imported lazily
# inside the function; absent on a bare install — install with frustrapy[clustering].
clustering = ["scipy", "scikit-learn", "python-igraph", "leidenalg", "statsmodels"]
# Optional PyRosetta mutation backend (method='pyrosetta'). PyRosetta itself is NOT
# on PyPI and is license-gated (free for academic/non-commercial use under the
# RosettaCommons license); it cannot be a normal dependency. This extra pulls the
# small `pyrosetta-installer` helper — after `pip install frustrapy[pyrosetta]` run
#   python -c "import pyrosetta_installer; pyrosetta_installer.install_pyrosetta()"
# to download and install the licensed PyRosetta wheel. Imported lazily inside the
# mutation worker; a bare install keeps method='threading' fully functional.
pyrosetta = ["pyrosetta-installer"]
all = ["frustrapy[viz,perf,clustering]"]

[project.urls]
Homepage = "https://github.com/engelberger/frustrapy"
Repository = "https://github.com/engelberger/frustrapy"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov"]
test = ["pytest>=8", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["frustrapy"]
# Force-include the subprocess toolchain assets so they always travel with the
# wheel even if a future .gitignore / VCS-exclusion rule would drop them:
#   the 4 precompiled LAMMPS binaries, the Perl + shell scripts, and the AWSEM
#   gamma/coeff data tree. Consumed at calc time via core/pdb.py -> the subprocess
#   fan-out in frustration_calculator.py (PdbCoords2Lammps.sh, *.pl, lmp_serial_*).
artifacts = [
    "frustrapy/core/scripts/lmp_serial_*",
    "*.pl",
    "*.sh",
    "frustrapy/core/scripts/AWSEMFiles/**/*",
]

[tool.hatch.build]
# Never ship bytecode caches.
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
# The regression suite (Phase 1) lives under tests/; it locks the 1CRN anchor and a
# fail-pre/pass-post test for every P0 fix. Run from an activated venv so the bare
# python3 spawned by PdbCoords2Lammps.sh resolves Biopython (tech-debt P1-22).
testpaths = ["tests"]
filterwarnings = [
    # The 9 non-raw `\s+` separators (Lever 12, Phase 6) emit SyntaxWarning today.
    "ignore::SyntaxWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
# Bare specifiers by design — uv.lock does the exact pinning.
